schema_version = "beforeit-us-production-reconciliation-readiness-contract.v2"
contract_id = "us-ws2c-production-reconciliation-readiness-v2"
classification = "CURRENT_VINTAGE_FAIL_CLOSED_READINESS_GATE_NOT_ORIGIN_ELIGIBLE"
promotion_status = "NOT_READY_NOT_PROMOTED"
scientific_scope = "Authenticated intake and fail-closed readiness assessment for a U.S. production accounting reconciliation. The candidate ledger and admission-evidence overlay now materialize production observation/control schemas, canonical lineage, full-grid display semantics, deterministic domestic-use sidecars, exact signed-flow evidence, and zero-weight dependence/revision receipts. The readiness gate transitively authenticates every admission dependency and implementation file while all candidate cells and controls remain quarantined: it admits no solver inputs, numerical reliability classes, covariance entries, exact-control approvals, structural-zero approvals, reconciled adjustments, model state, accounting-gate change, forecast origin, or forecast score."
admission_evidence_hash = "admission1:824a0cf2efae13c1b55966a40dd0edef49cb50d9b0c82f63f05952baf568d0a3"
target_country = "USA"
target_reference_period = "CALENDAR_YEAR_2024"
target_frequency = "ANNUAL"
target_time_basis = "CALENDAR_YEAR_ACCOUNTING_FLOW"
target_stock_flow_class = "FLOW"
target_currency = "USD"
target_unit = "MILLIONS_CURRENT_DOLLARS"
target_price_basis = "PRODUCERS_PRICES"
target_axis = "BEA_AFTER_REDEFINITIONS_68_CORE_PLUS_EXPLICIT_USED_OTHER_CLOSURE"
solver_method_id = "CONSTRAINED_STONE_GLS"
solver_invocation_status = "NOT_RUN_BLOCKED"
artifact_hash_policy = "Every dependency is a non-symlink regular file inside the repository and is SHA-256 checked immediately before semantic probes and immediately after them. Any path, type, hash, or probe mismatch aborts report construction."
missing_value_policy = "Native blank, ellipsis, suppression, source missing, not applicable, not evaluable, and selected-zero-not-shown remain nonnumeric source states until an approved observation model says otherwise."
zero_policy = "Explicit numeric zero is distinct from selected-zero-not-shown and from a confirmed structural zero. No absent or selected-zero cell enters the Gaussian solver as numeric zero."
sign_policy = "Every signed solver cell requires a code-keyed economic type and an explicit domain. Observed sign alone is not a domain for inventory changes, subsidies, import adjustments, margins, or existing-good transfers."
structural_zero_policy = "A structural zero requires direct topology evidence, an exact-fixed production class, and independent approval bound to the complete production-problem hash."
exact_control_policy = "Exact accounting identities are distinct from rounded or uncertain published totals. No source total becomes an exact fixed control without an approved independence and rounding-or-measurement assessment."
reliability_policy = "Synthetic confidence ranks and uncertainties are prohibited in production. Every adjustable cell requires a versioned source-specific uncertainty receipt covering the selected vintage, classification, transformation, and unit."
covariance_policy = "Source independence is never inferred from different labels. Shared lineage, controlled identities, revisions, crosswalks, valuation bridges, and aggregate-plus-component relations require explicit covariance or independent-coordinate treatment."
control_dependency_policy = "Fixed-only validation controls, independent adjustable restrictions, and dependent adjustable restrictions are reported separately. Aggregate and descendant observations are never double counted."
lineage_policy = "Each observation has one canonical source lineage. F030 and Used/Other overlays of the same BEA projection are semantic views, not additional independent observations."
production_cell_schema_fields = [
    "cell_id",
    "canonical_source_key",
