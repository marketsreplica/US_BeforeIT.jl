contract_id = "us-used-other-evidence-ledger-v1"
classification = "VINTAGE_SEPARATED_ACCOUNTING_EVIDENCE_NOT_ORIGIN_ELIGIBLE"
promotion_status = "RESEARCH_ONLY_NOT_PROMOTED"
scientific_role = "Fail-closed evidence and decision ledger for BEA special commodities. It preserves the pinned 2017 detailed and summary special-account cells and the pinned 2024 summary Used/Other cells as separate vintages. It tests only code-keyed source reconstruction and source-supported transfer/output semantics. It does not allocate 2024 composites, project 2017 shares, infer producers or agents from source placements, allocate dealer or transport services, absorb closure accounts into the model core, or write model state, gates, origins, or scores."
source_mask_policy = "Preserve numeric, native blank, native ellipsis, selected-zero-not-shown, explicit numeric zero, and signed value as separate fields. A blank, ellipsis, or selected-zero marker materializes as zero only in the source projection and is never relabeled as an explicit or structural zero."
vintage_policy = "2017 detailed S00401/S00402/S00300/S00900, 2017 independently rounded summary Used/Other, and 2024 summary Used/Other are separate evidence namespaces. No share, sign pattern, placement, or component weight crosses vintages."
component_policy = "The four 2017 detailed codes are typed as mixed scrap supply/disposal, existing-good or asset transfer, noncomparable-import boundary item, and rest-of-world final-use reclassification. S00401 make/output is current-production byproduct evidence while its negative final use is final-user or existing-asset scrap disposal; those channels remain distinct. Summary Used and Other remain unresolved composites."
mapping_policy = "All reconstruction is code keyed. Human-readable labels, signs, sparsity, source make placements, and account names cannot select a core sector, model agent, government producer, or rest-of-world behavior."
transfer_output_policy = "For a same-boundary existing-good transfer, the seller-negative and purchaser-positive values reclassify use and create no output of the underlying good. Only separately observed current transaction services can add output. The 2017 S00402 controls support the underlying-transfer test; service amounts are unobserved here."
dealer_transport_policy = "Trade services related to used goods, waste, and scrap and freight services on those items require separately identified service observations. No percentage margin or transport allocation is inferred from the net special row."
forecast_origin_admissible = false
promotion_ready = false
model_state_write = false
accounting_gate_effect = "NONE"
forecast_score_write = false

