[[blocked_transition]]
transition_id = "t50805b_prior_stock_transition"
blocker = "PRIOR_PERIOD_T50805B_STOCK_SLICE_NOT_PINNED"
required_evidence = "A byte-pinned, release-bound prior-quarter T50805B holder-stock slice on the identical source basis."
basis = "The pinned T50805B fixture contains only 2026Q1 end-of-quarter holder stocks, so no stock difference is observable."

[[blocked_transition]]
transition_id = "t50805b_stock_difference_to_t10105_cipi"
blocker = "STOCK_FLOW_REVALUATION_AND_TIMING_TERMS_NOT_PINNED"
required_evidence = "Inventory valuation adjustment, price-change, physical-volume, and average-quarter versus end-quarter timing terms."
basis = "BEA explicitly states that differences of current-dollar end-of-quarter stocks are not the current-dollar CIPI component of GDP."

[[blocked_transition]]
transition_id = "t50805b_holder_to_f030_commodity"
blocker = "HOLDER_TO_COMMODITY_CROSSWALK_NOT_PINNED"
required_evidence = "A source-supported, versioned holder-industry to commodity allocation with uncertainty and conservation controls."
basis = "T50805B is organized by inventory holder, while F030 is organized by commodity; equal labels do not identify an allocation."

[[blocked_transition]]
transition_id = "f030_annual_to_t10105_quarterly"
blocker = "ANNUAL_COMMODITY_TO_QUARTERLY_AGGREGATE_ALLOCATION_NOT_PINNED"
required_evidence = "A source-supported temporal allocation from annual commodity F030 flows to quarterly aggregate CIPI."
basis = "The signed annual F030 commodity vector must not be divided by four; the aggregate annual comparison is descriptive and source-rounded only."

[[blocked_transition]]
transition_id = "observed_holder_to_inventory_stage"
blocker = "OBSERVED_INVENTORY_STAGE_DECOMPOSITION_NOT_PINNED"
required_evidence = "Observed source bytes linking holder stocks to materials, work-in-process, and finished-goods stages."
basis = "The available stage ledger is synthetic contract data and cannot supply empirical stage shares."

[[blocked_transition]]
transition_id = "used_other_closure_transition"
blocker = "USED_OTHER_INVENTORY_TRANSITION_TREATMENT_NOT_PINNED"
required_evidence = "A source-supported treatment of BEA Used and Other closure commodities in inventory accumulation and valuation."
basis = "The closure commodity Other is distinct from T50805B holder labels containing Other and cannot be absorbed by a name match."

[[blocked_transition]]
transition_id = "current_vintage_to_forecast_origin"
blocker = "CURRENT_VINTAGE_RELEASE_STATE_NOT_FORECAST_ORIGIN_ELIGIBLE"
required_evidence = "Prospectively captured or independently reconstructed release-state artifacts available at each forecast origin."
basis = "T50805B and F030 are current-vintage diagnostics, and the revised T10105 history is not a first-release origin package."

[[blocked_transition]]
transition_id = "evidence_to_model_inventory_state"
blocker = "MODEL_STOCK_SCOPE_PRICE_AND_LATENT_STATE_RECONCILIATION_NOT_PINNED"
required_evidence = "A model-stock scope definition, valuation adapter, holder/commodity/stage bridge, and latent-state reconciliation protocol."
basis = "Evidence rows cannot emit a 68-sector inventory vector, S_s, initial conditions, runtime state, accounting gate, or promotion claim."
