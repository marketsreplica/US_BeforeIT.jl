scientific_role = "Pinned, source-faithful Census M3 manufacturing inventory-stage evidence. It preserves the adjusted and unadjusted total, materials and supplies, work-in-process, and finished-goods series, including source-missing cells. It evaluates only exact same-code published stage identities. It emits no economy-wide BEA allocation, commodity or holder crosswalk, stock-flow transition, model state, accounting gate, forecast origin, or forecast score."
forecast_origin_admissible = false
economy_wide_scope_claimed = false
bea_allocation_applied = false
commodity_holder_crosswalk_applied = false
transition_emitted = false
model_inventory_vector_emitted = false
model_state_write = false
accounting_gate_effect = "NONE"
forecast_score_effect = "NONE"

[implementation]
