price_adjustment = "NOT_ADJUSTED_FOR_PRICE_CHANGES"
adjusted_code = "A"
unadjusted_code = "U"
total_code = "TI"
materials_code = "MI"
work_in_process_code = "WI"
finished_goods_code = "FI"
missing_value_policy = "ABSENT_CELL_IS_SOURCE_MISSING_NOT_ZERO"
zero_policy = "NUMERIC_ZERO_IS_EXPLICIT_ZERO_DISTINCT_FROM_MISSING"
revision_policy = "CURRENT_WORKBOOK_CAN_REVISE_HISTORY; NO_PSEUDO_VINTAGE_OR_FIRST_RELEASE_CLAIM"
workbook_url_policy = "MUTABLE_OVERWRITTEN_CURRENT_WORKBOOK_CAPTURE_PINNED_BY_BYTES"
source_revision_status = "NOT_ENCODED_PER_CELL_IN_WORKBOOK"

[source_method]
stage_control_allocation_is_census_method = true
unadjusted_stage_method = "THREE_DIGIT_NAICS_TOTAL_INVENTORY_CONTROL; INITIAL_STAGE_RATIO_ESTIMATES; DIFFERENCE_PROPORTIONALLY_ALLOCATED_TO_STAGES"
seasonally_adjusted_stage_method = "STAGES_SEASONALLY_ADJUSTED_AT_THREE_DIGIT_NAICS; DIFFERENCE_TO_ADJUSTED_TOTAL_PROPORTIONALLY_ALLOCATED_TO_STAGES"
reason = "SIGNIFICANT_NUMBER_OF_COMPANIES_REPORT_TOTAL_INVENTORIES_BUT_CANNOT_REPORT_STAGE_DETAIL"
independent_stage_measurement_claimed = false
project_allocation_applied = false
identity_interpretation = "PUBLISHED_CONTROLLED_ACCOUNTING_IDENTITY_NOT_INDEPENDENT_STAGE_VALIDATION"

