canonical_key_policy = "Stable raw keys use typed length-prefixed source-member, year, projection, row/column type and code, unit, and price-basis fields. They exclude release hashes, values, positions, descriptions, and local view identifiers. Aggregated keys hash the normalized sorted parent-key functional."
lineage_policy = "Raw lineage hashes bind the stable key to release, workbook, fixture, projection, authenticated positions, exact integer source token, and source state. Aggregated lineage hashes bind the mapping contract, transformation, and sorted parent keys and lineages. Pure coefficient-one selection preserves the raw key and lineage."
selected_zero_policy = "A target is SOURCE_SELECTED_ZERO_NOT_SHOWN with raw_value absent only when every contributing source leaf is selected-zero-not-shown. Numeric cancellation to zero and published numeric zero remain SOURCE_EXPLICIT_NUMERIC_ZERO."
overlay_policy = "Inventory F030 and Used/Other records are value-free semantic references to canonical cell or control owners. They contribute zero observations and zero solver weight."
control_policy = "Published margins retain source state, canonical lineage, unresolved dependence, and no fixed or solver-active status. Five definitional identity families are materialized as unapproved candidates; approved exact-control count remains zero."
solver_policy = "All cells and controls are quarantined. No conversion to a synthetic benchmark problem, reconciliation call, adjustment record, or solver artifact is implemented."

