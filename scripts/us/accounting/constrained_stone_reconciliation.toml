estimator = "minimize 0.5*(x-y)'*Sigma^(-1)*(x-y) subject to A*x=b after exact fixed cells are removed from the adjustable vector"
solution = "x_hat=y+Sigma*A'*(A*Sigma*A')^plus*(b-A*y), using a tolerance-ranked Moore-Penrose inverse so consistent redundant exact controls do not change the unique primal solution"
posterior_covariance = "Sigma_hat=Sigma-Sigma*A'*(A*Sigma*A')^plus*A*Sigma"
