[artifact]
schema_version = "beforeit-household-consumption-implicit-price-analogue-qualification.v1"
canonicalization = "sorted_typed_v1_excluding_artifact_content_sha256"
content_sha256 = "a46757c3c73c946d2d6012f91a78f595439c56e2b20065634c140dbe6d762541"

[contract]
economic_object = "beforeit-household-consumption-implicit-price-analogue.v1"
qualification_status = "MODEL_OPERATOR_MECHANICS_VALIDATED_NONADMITTING"
information_track = "synthetic_model_operator_mechanics"
fixture_class = "SYNTHETIC_OPERATOR_TEST_FIXTURE"
input_path_kind = "CALLER_SUPPLIED_SYNTHETIC_RAW_PATHS"
measurement_regime = "SYNTHETIC_POST_STEP_HOMOGENEOUS"
raw_inputs = [
    "nominal_household_consumption",
    "real_household_consumption",
]
ratio_formula = "D[path,t]=N[path,t]/R[path,t]"
qoq_formula = "400*log(D[path,t]/D[path,t-1])"
four_quarter_formula = "100*log(D[path,t]/D[path,t-4])"
transformation_convention = "continuous_log_for_model_and_eventual_direct_truth_not_bea_published_compounded_annual_rate"
qoq_period_mapping = "input_row_t_maps_to_same_period_output_row_t_minus_1"
four_quarter_period_mapping = "input_row_t_maps_to_same_period_output_row_t_minus_4"
path_evaluation_rule = "transform_each_raw_path_before_any_summary"
rebase_rule = "positive_time_invariant_path_specific_D_scale_cancels"
opening_stitch_rule = "opening_D0_equals_one_by_normalization_and_must_not_be_joined_to_first_post_step_for_empirical_execution"
minimum_qoq_rows = 2
minimum_four_quarter_rows = 5
frequency = "quarterly"
qoq_output_unit = "percentage_points_annual_rate"
four_quarter_output_unit = "percentage_points"
official_equivalence_status = "NOT_VALIDATED"
tier1_total_pce_operator_approved = false
tier1_core_pce_operator_approved = false
origin_admissible = false
promotion_eligible = false

[boundaries]
blockers = [
    "BEA_FISHER_CHAIN_EQUIVALENCE_UNVALIDATED",
    "PCE_NPISH_PAYER_IMPUTATION_SCOPE_UNVALIDATED",
    "PURCHASER_PRICE_TAX_MARGIN_VALUATION_UNVALIDATED",
    "CORE_PCE_FOOD_ENERGY_CROSSWALK_UNVALIDATED",
    "DIRECT_RELEASE_VINTAGES_ABSENT",
    "SEASONAL_ADJUSTMENT_BRIDGE_UNVALIDATED",
    "OPENING_PRICE_BASKET_STITCH_UNRESOLVED",
    "TIER1_PCE_OPERATOR_APPROVAL_FALSE",
    "TIER1_CORE_PCE_OPERATOR_APPROVAL_FALSE",
]
prohibited_actions = [
    "construct_model",
    "run_model",
    "load_artifact",
    "load_truth",
    "emit_forecast",
    "score",
    "infer",
    "execute_opening_to_first_step_empirical",
    "admit_origin",
    "approve_tier1_operator",
    "promote",
    "register_production",
    "write_output",
]

[declarations]
synthetic_raw_path_input_only = true
transform_each_path_before_summary = true
model_construction_allowed = false
model_execution_allowed = false
artifact_input_allowed = false
truth_access_allowed = false
empirical_input_allowed = false
opening_to_first_step_empirical_allowed = false
forecast_emission_allowed = false
scoring_allowed = false
inference_allowed = false
origin_admissible = false
promotion_eligible = false
production_registry_allowed = false
write_output_allowed = false
official_total_pce_operator_claim_allowed = false
official_core_pce_operator_claim_allowed = false

