[[models]]
model_id = "naive_no_change"
support_status = "supported"
family = "random_walk"
information_track = "common_information"
products = ["quarterly_unconditional"]
target_panel_id = "tier1_quarterly_primary_transformations_v1"
source_artifact_ids = ["benchmark_kernel_source"]
model_card_artifact_id = "benchmark_model_card"

[models.specification]
constructor = "NoChangeSpec()"
forecast_method = "iterated"
lag_rule = "not_applicable"
hyperparameter_rule = "none"

[models.specification.parameters]

[models.transformations]
target_panel_rule = "use_registered_panel_in_declared_order"
estimation_input = "registered_primary_transformation"
inverse_transform = "not_applied_by_benchmark_kernel"
future_target_policy = "interface_has_no_future_target_field"

[models.estimation_window]
kind = "expanding"
minimum_training_quarters = 40
start_rule = "first_contiguous_complete_case_quarter_available_at_origin"
end_rule = "latest_eligible_complete_target_quarter_at_or_before_origin"
missing_data_policy = "fail_origin_no_imputation"

[models.pandemic_elb]
pandemic_treatment = "include_all_eligible_observations_no_dummy_no_downweighting"
pandemic_sensitivity_policy = "separately_versioned_prespecified_slices_never_selected_on_rankings"
elb_treatment = "observed_effective_federal_funds_rate_no_censoring_or_shadow_rate"
regime_selection = "none"

[models.density]
required = true
construction = "recursive_joint_gaussian_training_first_differences"
draw_count_rule = "positive_preregistered_count_required_for_density_scoring"
seed_rule = "explicit_nonnegative_integer_derived_by_origin_model_path"
parameter_uncertainty_included = false
cross_target_dependence = "training_residual_covariance"
stochastic_volatility = false

[models.fallback]
invalid_origin = "reject_before_estimation"
estimation_failure = "structured_failure_record"
silent_substitution = "prohibited"
ranking_failure_policy = "not_ranked_if_any_required_model_origin_failure"

[models.convergence]
algorithm_class = "closed_form_summary"
estimation_success_gate = "finite_required_training_moments"
density_success_gate = "exact_shape_and_all_finite_or_structured_failure"
stability_rule = "no_stability_filter_or_replacement_diagnostics_only_when_available"
iterative_convergence = "not_applicable_no_iterative_optimizer_or_mcmc"
failure_action = "retain_structured_failure_never_impute_or_omit"

