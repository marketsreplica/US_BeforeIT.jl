[artifact]
schema_version = "beforeit-us-release-availability-policy.v2"
policy_id = "beforeit-us-retrospective-release-availability.v2"
status = "SEALED_RESEARCH_ONLY_FAIL_CLOSED"
canonicalization = "utf8-length-prefixed-sorted-map-array-order.v1"
digest_algorithm = "sha256"
content_sha256 = "6af185c5fa8be4404a064294a0053eec093ca1a59cbc29f1a0566ada3364de11"

[assertions]
accepted_bases = [
    "actual_public_timestamp",
    "official_actual_release_date",
    "official_actual_release_date_range",
]
rejected_bases = [
    "schedule_only",
    "planned_release_date",
    "retrieval_timestamp",
    "unexplained_vintage_date",
    "route_level_claim",
    "unknown_timezone",
]
unknown_basis_action = "reject"
timestamp_precision = "rfc3339_utc_exact_second"
exact_timestamp_semantics = "actual_public_instant"
actual_date_semantics = "source_local_calendar_day_half_open"
actual_date_range_semantics = "inclusive_source_local_dates_half_open"

[interval]
boundary_semantics = "half_open"
date_interval_lower_rule = "local_start_date_midnight_using_sealed_start_offset"
date_interval_upper_rule = "day_after_local_end_date_midnight_using_sealed_end_offset"
safe_not_before_rule = "exact_instant_or_date_interval_exclusive_upper_bound"
origin_at_upper_bound_temporal_gate_allowed = true
same_local_day_origin_allowed = false

[timezone]
conversion_method = "sealed_iana_tzdb_local_midnight_table_no_runtime_tzdb"
runtime_tzdb_dependency_allowed = false
source_timezone_required = true
timezone_rules_evidence_required = true
utc_offset_format = "signed_hh_mm"
minimum_utc_offset_minutes = -840
maximum_utc_offset_minutes = 840
allowed_offset_delta_minutes = [-60, 0, 60]
semantics_artifact_locator = "urn:beforeit:iana-tzdb:2026c:us-release-availability-semantics"
semantics_artifact_sha256 = "8ed940e6deb1a1aa0922369eb8b0ad327ecf52def3c37c7317f81b87afe7a174"

[timezone.allowed_offsets]
UTC = ["+00:00"]
"America/New_York" = ["-05:00", "-04:00"]
"America/Chicago" = ["-06:00", "-05:00"]

[evidence]
availability_evidence_sha256_required = true
release_byte_evidence_sha256_required = true
vintage_evidence_sha256_required = true
evidence_content_sha256_required = true
zero_sha256_allowed = false
availability_release_byte_and_vintage_evidence_must_be_pairwise_distinct = true

[scope]
evidence_scope = "retrospective_research"
empirical_forecast_execution_allowed = false
production_scoring_allowed = false
origin_admission_authorized = false
inventory_mutation_authorized = false
temporal_gate_only = true
