[artifact]
schema_version = "beforeit-us-schema-contract.v1"
document_schema = "beforeit-us-raw-object-catalog.v1"
evidence_class = "SYNTHETIC_INERT"

[catalog]
object_order = "LEXICOGRAPHIC_ASCENDING_OBJECT_ID"
object_ids_globally_unique = true
requested_and_effective_uri_reuse_allowed = true
provider_request_subjects_globally_unique = true
provider_object_subjects_globally_unique = true
raw_relative_paths_globally_unique = true
physical_access_performed = false
maximum_object_bytes = 536870912
maximum_catalog_bytes = 2147483648
checked_integer_addition_required = true

[object]
required_fields = [
    "object_id",
    "source_id",
    "artifact_role",
    "media_type",
    "request_method",
    "requested_uri",
    "final_effective_uri",
    "redirect_policy",
    "request_payload_sha256",
    "request_ordinal",
    "provider_object_version",
    "provider_object_subject_sha256",
    "relative_path",
    "sha256",
    "byte_count",
    "replicas",
]
replica_count = 2

[replica]
required_fields = [
    "replica_id",
    "relative_path",
    "sha256",
    "byte_count",
    "storage_domain_id",
    "storage_backend_id",
    "storage_object_version",
    "custody_operator_key_id",
    "custody_attestation_id",
    "catalog_object_subject_sha256",
]
globally_unique_fields = [
    "replica_id",
    "relative_path",
    "storage_object_version",
    "custody_attestation_id",
]
pairwise_distinct_fields = [
    "replica_id",
    "relative_path",
    "storage_domain_id",
    "storage_backend_id",
    "storage_object_version",
    "custody_operator_key_id",
    "custody_attestation_id",
]
operator_key_reuse_across_different_objects_allowed = true
raw_hash_and_byte_count_binding_required = true
catalog_object_subject_binding_required = true
catalog_object_subject_binds_provider_object_version = true

[request_identity]
allowed_methods = ["GET", "POST"]
https_required = true
requested_uri_required = true
final_effective_uri_required = true
redirect_policy = "FORBID_REDIRECTS_REQUIRE_URI_EQUALITY"
requested_and_final_uri_equality_required = true
request_payload_or_query_sha256_required = true
get_payload_sha256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
request_ordinal_required = true
effective_uri_alone_is_not_identity = true
provider_object_subject_binds_response_hash_size_media_and_version = true

[media_types]
allowed = [
    "application/json",
    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
    "application/zip",
    "text/csv",
    "text/plain",
    "text/tab-separated-values",
]
fixed_assets_demonstration = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
bls_api_demonstration = "application/json"
