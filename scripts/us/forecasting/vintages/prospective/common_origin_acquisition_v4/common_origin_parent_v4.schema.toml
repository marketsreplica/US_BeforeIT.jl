[artifact]
schema_version = "beforeit-us-schema-contract.v1"
document_schema = "beforeit-us-common-origin-parent.v4"
evidence_class = "SYNTHETIC_INERT"
status_ceiling = "CANNOT_RUN"

[contract]
unknown_fields = "REJECT"
required_evidence_class = "SYNTHETIC_INERT"
required_candidate_status = "CANNOT_RUN"
required_maximum_status = "CANNOT_RUN"
claim_ceiling = "SYNTHETIC_SCHEMA_AND_FAIL_CLOSED_LOGIC_ONLY_NO_AUTHENTICATED_ORIGIN"
catalog_schema = "beforeit-us-raw-object-catalog.v1"
selection_schema = "beforeit-us-profile-object-set-selection.v2"
trust_bootstrap_schema = "beforeit-us-trust-bootstrap-reference.v1"
key_registry_schema = "beforeit-us-trust-key-registry.v1"
rfc3161_schema = "beforeit-us-rfc3161-evidence.v1"
custody_schema = "beforeit-us-custody-operator-manifest.v1"
release_manifest_schema = "beforeit-us-verifier-release-manifest.v1"
independent_result_schema = "beforeit-us-independent-validation-result.v2"
parent_subject_scope = "ENTIRE_CLOSED_PARENT_TABLE"
manual_partial_projection_allowed = false

[gates]
all_required_false = [
    "network_allowed",
    "raw_access_allowed",
    "signing_allowed",
    "timestamp_submission_allowed",
    "origin_admission_allowed",
    "model_access_allowed",
    "truth_access_allowed",
    "scoring_allowed",
    "inventory_mutation_allowed",
    "worklog_mutation_allowed",
]
