[artifact]
schema_version = "beforeit-us-schema-contract.v1"
document_schema = "beforeit-us-profile-object-set-selection.v2"
evidence_class = "SYNTHETIC_INERT"

[selection]
required_fields = [
    "schema_version",
    "profile_id",
    "ordered_object_ids",
    "projection",
    "projection_subject_sha256",
]
minimum_objects = 1
duplicates_within_selection_allowed = false
references_must_resolve_in_parent_catalog = true
sharing_catalog_objects_across_profiles_allowed = true
catalog_objects_counted_once_for_storage = true
ordered_selection_semantics = true
projection_subject_binds_profile_and_ordered_objects = true
production_projection_binding_present = false

[projection]
schema_version = "beforeit-us-profile-projection-descriptor.v1"
closed_required_fields = [
    "schema_version",
    "source_id",
    "projection_kind",
    "container_id",
    "sheet_or_series_id",
    "table_or_formula_id",
    "line_selector",
    "coverage_selector",
    "unit_selector",
    "frequency",
    "interpretation",
    "production_binding_state",
]
bea_workbook_section_sheet_table_line_year_unit_bound = true
bls_series_or_formula_coverage_no_gap_unit_bound = true
synthetic_fixture_binding_state = "ABSENT_SYNTHETIC_SENTINEL"

[demonstration_geometry]
fixed_assets_section_3_profile_count = 3
fixed_assets_section_5_profile_count = 3
fixed_assets_section_7_profile_count = 2
bls_cps_profile_count = 6
bls_cps_ordered_chunk_count_per_profile = 3
demonstration_profile_count = 14
production_profile_count = 107
production_profile_closure_present = false
