[artifact]
schema_version = "beforeit-us-effr-observed-state-contract.v3"
contract_id = "beforeit-us-effr-observed-state-offline-adjudication.v3"
contract_version = "3.0.0"
incompatible_with = "beforeit-us-effr-one-effective-date-capture-receipt.v2"
status = "CANDIDATE_OFFLINE_NONADMITTING"
canonicalization = "sorted_typed_length_aware_excluding_artifact_content_sha256.v1"
content_sha256 = "33eb8eba8a6399568c0890d86d555cb5177659d62c098522098ca5d6ce21952c"

[current_state_disposition]
current_openapi_definition = "ABSENT"
captured_wire_presence = "ABSENT"
authoritative_evidence_ever_official = "NOT_ESTABLISHED"
raw_false_derivation_allowed = false
synthetic_current_state_allowed = false

[observations]
morning_class = "MORNING_WINDOW_ENDPOINT_OBSERVATION"
post_revision_class = "POST_REVISION_WINDOW_ENDPOINT_OBSERVATION"
transition_class = "OBSERVED_EFFR_TRANSITION"
morning_window_start_utc = "13:00:00Z"
morning_window_end_utc = "13:15:00Z"
post_revision_window_start_utc = "18:30:00Z"
post_revision_window_end_utc = "18:45:00Z"
pair_atomic = false

[parser]
envelope_keys = ["refRates"]
effr_type_literal = "EFFR"
rate_required_fields = ["effectiveDate", "type", "percentRate", "percentPercentile1", "percentPercentile25", "percentPercentile75", "percentPercentile99", "targetRateFrom", "targetRateTo", "revisionIndicator"]
volume_required_fields = ["effectiveDate", "type", "volumeInBillions", "revisionIndicator"]
allowed_revision_tokens = ["", "r"]
footnote_field = "footnoteId"
footnote_ids = [1, 2, 3]
footnote_alias_allowed = false
duplicate_members_rejected_before_materialization = true
exact_numeric_lexemes_preserved = true
max_json_body_bytes = 1048576
max_json_nesting_depth = 64
max_json_number_bytes = 96
max_json_mantissa_digits = 40
max_json_abs_exponent = 20
percent_alias_allowed = false
unknown_fields_allowed = false

[policy]
marked_revision_token = "r"
rate_change_threshold_basis_points = 1
strictly_greater_than_threshold = true
footnote_required_for_marked_revision = false
footnote_pair_rule = "EXACT_FOOTNOTE_ID_INTEGER_OR_ABSENCE_MATCH_OR_QUARANTINE"
unchanged_claim = "NO_MARKED_REVISION_OBSERVED_AS_OF_SECOND_CAPTURE"

[estimand]
status = "PENDING"
candidate_estimands = ["STRICT_FIRST_PUBLIC_BYTES", "PRE_ORIGIN_OBSERVED_ENDPOINT_VINTAGE"]
owner_validator_decision = "REQUIRED_BEFORE_ORIGIN_ADMISSION"

[gates]
accuracy_evaluation_allowed = false
empirical_forecast_allowed = false
external_timestamp_authenticated = false
full_campaign_complete = false
network_exchange_count_externally_witnessed = false
operator_authorization_externally_authenticated = false
origin_admissible = false
other_required_profiles_complete = false
production_use_allowed = false
production_scoring_allowed = false
profile_completion_authorized = false
promotion_eligible = false
publisher_provenance_authenticated = false
raw_durably_stored_external = false
readiness = false
source_inventory_mutation_allowed = false
transport_provenance_authenticated = false

