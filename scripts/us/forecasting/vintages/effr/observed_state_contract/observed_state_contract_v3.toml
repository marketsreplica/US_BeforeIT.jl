[[transition_matrix]]
sequence = 1
evidence = "both empty tokens; selected EFFR semantics and full bodies identical"
decision = "NO_MARKED_REVISION_OBSERVED_AS_OF_SECOND_CAPTURE"

[[transition_matrix]]
sequence = 2
evidence = "morning empty; later coherent r pair; exact published decimal-lexeme rate change strictly greater than one basis point; optional contingency footnoteId absent or the same exact JSON integer"
decision = "MARKED_SAME_DAY_REVISION_OBSERVED"

[[transition_matrix]]
sequence = 3
evidence = "morning endpoint already carries r"
decision = "QUARANTINED_MORNING_ALREADY_MARKED_REVISED"

[[transition_matrix]]
sequence = 4
evidence = "later empty token but selected EFFR semantics change"
decision = "QUARANTINED_UNMARKED_EFFR_TRANSITION"

[[transition_matrix]]
sequence = 5
evidence = "later r without a published rate change strictly greater than one basis point"
decision = "QUARANTINED_MARKED_REVISION_POLICY_INCONSISTENT"

[[transition_matrix]]
sequence = 6
evidence = "rate and volume tokens, exact footnoteId integers or absence, dates, types, or capture roles differ"
decision = "QUARANTINED_RATE_VOLUME_PAIR_MISMATCH"

[[transition_matrix]]
sequence = 7
evidence = "selected EFFR semantics identical but full response bytes differ"
decision = "QUARANTINED_FULL_RESPONSE_CHANGED_WITHOUT_EFFR_TRANSITION"

[[transition_matrix]]
sequence = 8
evidence = "missing or unknown token, alias, new field, duplicate member, currentState, or unknown category"
decision = "QUARANTINED_SUCCESSOR_PROFILE_REQUIRED"

