[[evidence_gaps]]
gap_id = "historical_byte_availability"
description = "Retrieval in August 2026 proves only what HMI7 served at audit time, not which bytes were available at a historical forecast origin."
required_resolution = "Obtain authenticated release-time receipts or immutable contemporaneous archives."

[[evidence_gaps]]
gap_id = "archive_label_dates"
description = "Archive-folder dates are descriptive metadata and sometimes disagree with embedded workbook publication dates."
required_resolution = "Resolve publication events from an authoritative schedule and preserve exact event evidence."

[[evidence_gaps]]
gap_id = "post_publication_file_creation"
description = "Several archived workbooks report file-creation times after their embedded publication dates."
required_resolution = "Establish whether the served bytes reproduce the publication state or a later regeneration."

[[evidence_gaps]]
gap_id = "timestamp_and_timezone"
description = "Older workbook headers generally provide dates without exact times or timezones; modern header times still lack independently authenticated timezone evidence."
required_resolution = "Attach authoritative timestamp, timezone, and release-event identity evidence."

[[evidence_gaps]]
gap_id = "uninspected_releases"
description = "The audit sampled releases and adjacent break pairs; it did not inspect every HMI7 release."
required_resolution = "Acquire, hash, and content-validate every intended release independently."

[[evidence_gaps]]
gap_id = "cross_vintage_transform"
description = "Mixing levels across releases or base-year regimes can create false growth or inflation."
required_resolution = "Compute transformations from reference-period levels frozen within one declared truth vintage."

[[evidence_gaps]]
gap_id = "unit_scale"
description = "GDP workbook units change from billions to millions at the October 2017 modernization."
required_resolution = "Apply an explicit, tested scale conversion before level comparison."

[[evidence_gaps]]
gap_id = "directory_anomalies"
description = "HMI7 contains naming anomalies and duplicate-looking archive directory labels."
required_resolution = "Use reverse-checked directory IDs plus frozen workbook hashes, never archive labels alone."

[[evidence_gaps]]
gap_id = "price_change_observable"
description = "Table 2.3.4 supplies price-index levels; BEA Table 2.3.7 is a distinct published percent-change observable."
required_resolution = "Keep the protocol log-inflation transform tied to same-vintage Table 2.3.4 levels unless a separately versioned target adopts Table 2.3.7."
