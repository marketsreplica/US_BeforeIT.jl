schema_version = "beforeit-us-bea-nipa-workbook-receipt-schema.v1"
receipt_schema_version = "beforeit-us-bea-nipa-workbook-receipt.v1"
target_profile_schema_version = "beforeit-us-bea-nipa-workbook-target-profile.v1"
content_fingerprint_schema_version = "beforeit-us-bea-nipa-content-fingerprint.v2"
content_fingerprint_parser_version = "beforeit-us-bea-nipa-ooxml-parser.v2"
content_fingerprint_parser_sha256 = "7f054199aa7077a2ee3a68c001279a3795c9d4305031588253441ddb90cda55e"
content_fingerprint_canonicalization = "utf8_sorted_keys_compact_json_lf"
content_fingerprint_semantic_identity_scope = "RAW_WORKBOOK_BYTES_RELEASE_MAPPING_PARSED_VALUES_AND_PARSER_BYTES"
canonicalization = "sorted_typed_v1_excluding_artifact_content_sha256"
digest_algorithm = "sha256"
atomic_pair = ["1", "2"]
production_scope = "PRESENT_DAY_ACQUISITION_OBSERVATION"
production_state = "PRESENT_DAY_BYTES_OBSERVED_NOT_HISTORICAL_AVAILABILITY"
atomicity_policy = "ALL_OR_NOTHING_SECTION_1_AND_2_SAME_RELEASE_TRANSACTION"
identity_rule = "Requested and effective URL must be the same exact official apps.bea.gov HMI7 URL; URL year, quarter, archive component, filename, section, extension, profile, byte count, and SHA-256 must agree."
raw_rule = "Both local artifacts must be regular adjacent non-symlink files with content-addressed names, exact decoded bytes and SHA-256, and the declared XLS or XLSX container signature."
http_rule = "Each GET must have HTTP 200, zero redirects, format-specific media type, explicit presence/absence state for Content-Length, ETag, Last-Modified, and Content-Disposition, and exact observed values."
timestamp_rule = "Acquisition start, response-header, and completion timestamps are UTC second-precision observations within one bounded pair transaction; pair span is computed from the exact serialized second-precision endpoints."
semantic_rule = "The exact target-profile TOML and canonical content-fingerprint JSON files, profile content hash, fingerprint schema and parser hashes, pinned mapping-audit hash, release/workbook identities, raw hashes, byte counts, URLs, and all five recomputed target mapping fingerprints must agree."
content_fingerprint_rule = "The adjacent canonical JSON file must match its exact file SHA-256, declare the supported schema and exact parser SHA-256, contain the same two raw workbook hashes as the receipt, and reproduce all five mapping-audit fingerprints."
content_fingerprint_environment_rule = "Execution-environment and repository-state metadata are excluded from the hashed semantic identity; execution_environment_included and repository_state_included must remain false."
ambiguity_rule = "Reject missing or duplicate pair members, cross-release identity, conflicting URL/profile/raw links, duplicate acquisition observations, and reuse of a raw SHA under conflicting identities."
retrieval_time_semantics = "Present-day acquisition time is provenance only and cannot substitute for historical release or availability time."
historical_release_availability_verified = false
release_event_timestamp_verified = false
first_state_verified = false
origin_admissible = false
inventory_registered = false
ready = false

[semantic_linkage]
required_content_fingerprint_fields = [
    "content_fingerprint_artifact_path",
    "content_fingerprint_file_sha256",
    "content_fingerprint_schema_version",
    "content_fingerprint_parser_sha256",
]
content_fingerprint_target_count = 5
content_fingerprint_workbook_sections = ["1", "2"]
historical_availability_inferred = false
origin_admission_inferred = false

[programmatic_api]
constructor = "build_receipt"
parsed_validator = "validate_receipt"
file_validator = "validate_receipt_file"
local_raw_verifier = "verify_local_raw_files"
set_ambiguity_validator = "validate_receipt_set"
constructor_writes_files = false
live_driver_included = false

[storage]
production_raw_encoding = "identity"
synthetic_fixture_encoding = "base64_rfc4648"
profile_file_must_be_exactly_hashed = true
content_fingerprint_file_must_be_exactly_hashed = true
content_fingerprint_json_must_be_canonical = true
raw_files_must_be_content_addressed = true
adjacent_files_only = true
symbolic_links_allowed = false
