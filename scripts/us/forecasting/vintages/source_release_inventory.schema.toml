schema_version = "beforeit-us-source-release-schema.v1"
inventory_schema_version = "beforeit-us-source-release-inventory.v1"
requirements_schema_version = "beforeit-us-source-completeness-requirements.v1"
canonicalization = "utf8-length-prefixed-sorted-map-array-order.v1"
digest_algorithm = "sha256"
realtime_interval_semantics = "[realtime_start_utc,realtime_end_utc)"
selection_rule = "for each required reference interval, rank covering releases with release_timestamp_utc, availability_timestamp_utc, and realtime_start_utc no later than the origin; select the latest rank and then require origin_timestamp_utc < realtime_end_utc"
realtime_start_rule = "realtime_start_utc equals availability_timestamp_utc"
supersession_rule = "the latest available covering release wins even when immutable open-ended intervals overlap; an expired latest release cannot fall back to an older release"
retrieval_rule = "retrieved_at_utc is provenance, not a substitute for evidenced source availability"
identical_content_refetch_rule = "allowed only with a unique retrieval_event_id and distinct retrieval provenance; release-event immutable fields and raw_sha256 must agree"
ambiguity_rule = "reject multiple release_event_id values for the same snapshot and exact release/availability timestamps"

[timestamps]
format = "RFC3339_seconds_Z"
timezone = "UTC"
precision = "seconds"
date_only_or_minute_only = "rejected"
fractional_seconds = "rejected"
missing_intraday_timestamp = "rejected"

[inventory]
required_top_level_keys = [
    "artifact",
    "release_events",
    "admissible_origin_timestamps_utc",
    "audit_facts",
]
allowed_statuses = ["OPEN", "INCOMPLETE", "COMPLETE"]
required_evidence_verifier_status = "NOT_IMPLEMENTED_FAIL_CLOSED"
event_order = "retrieved_at_utc_then_retrieval_event_id"

[inventory.artifact]
required_keys = [
    "schema_version",
    "inventory_id",
    "status",
    "evidence_verifier_status",
    "canonicalization",
    "digest_algorithm",
    "content_sha256",
]

[inventory.release_event]
required_keys = [
    "retrieval_event_id",
    "release_event_id",
    "source_id",
    "source_family",
    "dataset_id",
    "series_id",
    "release_timestamp_utc",
    "availability_timestamp_utc",
    "availability_basis",
    "availability_evidence_locator",
    "retrieved_at_utc",
    "raw_sha256",
    "source_release_id",
    "source_locator",
    "retrieval_locator",
    "reference_period_start",
    "reference_period_end",
    "realtime_start_utc",
    "realtime_end_utc",
    "frequency",
    "unit",
    "seasonal_adjustment",
    "annual_rate_flag",
    "stock_flow_index_rate",
    "price_basis",
    "transformation_version",
    "classification",
    "classification_vintage",
    "quality_status",
]
allowed_quality_statuses = ["APPROVED", "DUBIOUS", "REJECTED"]
raw_sha256_format = "64_lowercase_hex"
realtime_end_is_exclusive = true

[inventory.audit_fact]
required_keys = [
    "fact_id",
    "finding",
    "evidence_locator",
    "implication",
    "distribution_status",
]
allowed_distribution_statuses = [
    "TRACKED_DISTRIBUTABLE",
    "EXTERNAL_ARCHIVE",
    "IGNORED_LOCAL_ONLY_NOT_REGISTERED",
    "NOT_AVAILABLE",
]

[requirements]
required_top_level_keys = ["artifact", "blocks"]
required_block_kinds = ["source", "target", "structural"]
required_protocol_sha256 = "88519e5b04936f528396cf5243ff270844d0d38651fd84fc3b1c76fef997b584"
required_approval_status = "DRAFT_UNAPPROVED"

[requirements.artifact]
required_keys = [
    "schema_version",
    "requirements_id",
    "protocol_sha256",
    "approval_status",
    "canonicalization",
    "digest_algorithm",
    "content_sha256",
]

[requirements.block]
required_keys = [
    "block_id",
    "block_kind",
    "source_id",
    "source_family",
    "dataset_id",
    "series_id",
    "frequency",
    "unit",
    "seasonal_adjustment",
    "annual_rate_flag",
    "stock_flow_index_rate",
    "price_basis",
    "transformation_version",
    "classification",
    "classification_vintage",
    "required_reference_period_start",
    "required_reference_period_end",
    "allowed_quality_statuses",
]
coverage_rule = "release_reference_start <= required_reference_start and required_reference_end <= release_reference_end"
allowed_completeness_quality_statuses = ["APPROVED", "DUBIOUS"]
incomplete_output = "beforeit-us-source-cannot-run.v1"
