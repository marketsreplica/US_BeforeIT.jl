[artifact]
schema_version = "beforeit-us-opening-macro-mapping.v1"
canonicalization = "sorted_typed_v1_excluding_artifact_content_sha256"
content_sha256 = "febe49f6f71425f170c1fd3ed6f95aea8f921751018f5457218e355f55e61047"

[gate]
status = "OPEN"
rule = "all_required_mappings_approved_with_evidence_and_independent_ownership"

[[mapping]]
mapping_id = "pce"
source_control_id = "pce"
model_concept = "Personal consumption expenditures at purchasers' prices, including nonprofit institutions serving households."
model_fields = [
    "initial_conditions.opening_nominal_household_consumption",
    "parameters.psi",
]
status = "unresolved"
treatment = "Retain the implemented source observation field, then design and validate an origin-state rake over household incomes, wealth, and expenditure while preserving the behavioral interpretation of psi; the observation adapter alone does not approve the latent mapping."
evidence = [
    "src/utils/data.jl:update_data_init! exposes the explicit opening observation while model_implied_opening_macro retains PCE from household income times psi.",
    "data/us/validation/ACCOUNTING_GATES.toml SHA-256 8884f6946ea76de65d3f99ce92bacd0bf5b7aa0a5f4717b8a7b8c12439018d7a records model-minus-source PCE gaps of +7399.033845 million dollars in 2024Q4 and +35083.049902 million dollars in 2026Q1; observation-only current-vintage diagnostic, no mapping approval.",
]
model_owner = "unassigned"
independent_validator = "unassigned"

[[mapping]]
mapping_id = "gpdi"
source_control_id = "gpdi"
model_concept = "Gross private domestic investment, including private fixed investment and signed change in private inventories."
model_fields = [
    "initial_conditions.opening_nominal_capitalformation",
    "data.nominal_capitalformation",
]
status = "unresolved"
treatment = "Retain NIPA GPDI as the implemented opening observable, while separately reconciling the model's steady-state replacement-investment construct, sector allocation, and capital-stock consequences; the observed row must not be treated as a latent-state repair."
evidence = [
    "src/utils/data.jl:update_data_init! stores source GPDI in the observed row while model_implied_opening_macro preserves replacement investment plus housing as a separate diagnostic.",
    "data/us/validation/ACCOUNTING_GATES.toml SHA-256 8884f6946ea76de65d3f99ce92bacd0bf5b7aa0a5f4717b8a7b8c12439018d7a records model-minus-source GPDI gaps of +75768.826822 million dollars in 2024Q4 and +77905.369718 million dollars in 2026Q1; observation-only current-vintage diagnostic, no mapping approval.",
]
model_owner = "unassigned"
independent_validator = "unassigned"

