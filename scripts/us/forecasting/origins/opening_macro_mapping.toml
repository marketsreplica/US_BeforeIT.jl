    "initial_conditions.opening_nominal_inventory_investment",
    "data.nominal_inventory_investment",
    "initial_conditions.S_s",
]
status = "rejected"
treatment = "Retain the implemented signed inventory-investment observation, reject mapping that flow to S_s or to any commodity-balance gap, and independently source and allocate a nonnegative quarter-end inventory stock before reconsidering approval."
evidence = [
    "data/us/validation/ACCOUNTING_GATES.toml SHA-256 8884f6946ea76de65d3f99ce92bacd0bf5b7aa0a5f4717b8a7b8c12439018d7a records signed source flows of +4447.25 million dollars in 2024Q4 and -7013.25 million dollars in 2026Q1 against model-implied zero, with no candidate S_s or inventory-named discrepancy alias; observation-only current-vintage diagnostic, no mapping approval.",
    "The same gate records the legacy S_s construction as a rejected proxy and the candidate T007 gap as an unreconciled diagnostic that is mapped to neither inventory flow nor inventory stock.",
    "The legacy commodity discrepancy has -0.037109 correlation with official annual F030 inventory investment.",
]
model_owner = "unassigned"
independent_validator = "unassigned"

