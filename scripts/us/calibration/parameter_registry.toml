description = "Requested simulation horizon stored in the structural parameter artifact."
economic_unit = "quarters"
frequency = "per model run"
sector_dimension = "scalar"
parameter_class = "G"
source_series = ["model configuration"]
source_table_and_line = "src/utils/calibration.jl:897"
