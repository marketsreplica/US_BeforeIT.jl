[schema]
registry_id = "beforeit-us-raw-structural-parameters"
schema_version = "1.0.0"
baseline_artifact = "data/us/baselines/US_2024Q4_structural.jld2"
baseline_parameter_count = 66
baseline_artifact_sha256 = "8d99e47c24e72dc05a8afa561a9b3c27cac6efc63fd046a571cee42e06d5501d"
scope = "Raw structural parameters only; class-H corrections and forecast combinations are forbidden"
as_of = "2026-08-05"
gate_policy = "Only approved rows may pass WS-2B; provisional, unresolved, or rejected rows keep the gate closed"

[parameter_classes]
A = "Directly observed: update only on an eligible release"
B = "Identity-derived: recompute after the relevant reconciled release"
C = "Econometrically estimated: re-estimate at the frozen-origin cadence"
D = "Latent behavioral: estimate from identified training moments and freeze between reviews"
E = "Institutional or policy: update on a rule change or eligible evidence release"
F = "Modeling assumption: replication value plus explicit sensitivity range; never silently fit"
G = "Numerical resolution: change only after numerical validation"
H = "Publication layer: past-error correction or combination weight; prohibited in raw structural parameters"

[review_statuses]
approved = "Source, identity, uncertainty, tests, ownership, and independent review are complete"
provisional = "Construction is traceable but independent review or a preregistered check remains open"
unresolved = "A named conceptual, measurement, accounting, or sensitivity decision remains open"
rejected = "The current construction failed a registered test and is ineligible"

[forecast_products]
raw_abm = "Uncorrected agent-based model path"
aggregate = "Production aggregate forecast"
sector = "Production sector forecast"
nowcast = "Within-quarter production nowcast"
density = "Production probabilistic forecast"
scenario = "Production conditional scenario"
research_only = "Diagnostic or sensitivity output carrying a visible non-production label"

[[parameter]]
