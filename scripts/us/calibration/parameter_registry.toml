admissible_range = "positive integer; production protocol currently requires 12"
prior_or_uncertainty = "No sampling uncertainty; alternative horizons require forecast-protocol validation."
update_cadence = "only with a versioned forecast-product horizon change"
allowed_forecast_products = ["raw_abm", "research_only"]
identification_targets = ["forecast horizon contract", "array allocation bounds"]
