name: Run tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags: '*'
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}

      - uses: actions/cache@v5
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: 2
          BEFOREIT_RUN_REMOTE_TESTS: 'false'

  us-offline:
    name: U.S. hermetic validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          # Pinned exactly: the ABM seed stream derives from Base.hash and is drawn
          # through the default global RNG, both of which are version-bound. A
          # different 1.10.x would produce different paths from the same seeds and
          # could not reproduce the committed ensemble caches.
          version: '1.10.3'
      - uses: actions/cache@v5
        env:
          cache-name: cache-us-offline
        with:
          path: ~/.julia
          key: ${{ runner.os }}-us-${{ env.cache-name }}-${{ hashFiles('scripts/us/Project.toml', 'scripts/us/Manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-us-${{ env.cache-name }}-
            ${{ runner.os }}-us-
      - name: Instantiate U.S. environment
        run: julia --project=scripts/us -e 'using Pkg; Pkg.instantiate()'
      - name: U.S. pipeline offline tests
        run: julia --startup-file=no --project=scripts/us scripts/us/test/runtests.jl
      - name: Source-aware supply, make, and symmetric-use diagnostics
        run: julia --startup-file=no --project=scripts/us scripts/us/accounting/test_supply_make.jl
      - name: Official BEA direct and total-requirements comparator
        run: julia --startup-file=no --project=scripts/us scripts/us/accounting/test_requirements.jl
      - name: BEA after-redefinitions common producer-basis diagnostic
        env:
          JULIA_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: julia --startup-file=no --project=scripts/us scripts/us/accounting/test_after_redefinitions_common_basis.jl
      - name: BEA after-redefinitions 68-sector model-core aggregation
        env:
          JULIA_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: julia --startup-file=no --project=scripts/us scripts/us/accounting/test_after_redefinitions_model_core.jl
      - name: BEA after-redefinitions valuation envelope
        env:
          JULIA_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: julia --startup-file=no --project=scripts/us scripts/us/accounting/test_after_redefinitions_valuation_envelope.jl
      - name: BEA after-redefinitions final-use and GDP envelope
        env:
          JULIA_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: julia --startup-file=no --project=scripts/us scripts/us/accounting/test_after_redefinitions_final_use_envelope.jl
      - name: BEA after-redefinitions producer-price adapter candidate
        env:
          JULIA_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: julia --startup-file=no --project=scripts/us scripts/us/accounting/test_after_redefinitions_producer_price_adapter_candidate.jl
      - name: Rejected BEA generic industry-transform diagnostic
        env:
          JULIA_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: julia --startup-file=no --project=scripts/us scripts/us/accounting/test_after_redefinitions_generic_industry_transform_diagnostic.jl
      - name: BEA after-redefinitions closure-boundary candidate
        env:
          JULIA_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: julia --startup-file=no --project=scripts/us scripts/us/accounting/test_after_redefinitions_closure_boundary_candidate.jl
      - name: BEA aggregate-first 68-sector scrap-adjusted diagnostic
        env:
          JULIA_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: julia --startup-file=no --project=scripts/us scripts/us/accounting/test_after_redefinitions_aggregate_first_scrap_adjusted_diagnostic.jl
      - name: BEA 2017 detailed special-account reconstruction evidence
