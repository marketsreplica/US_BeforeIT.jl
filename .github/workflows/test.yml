          OPENBLAS_NUM_THREADS: 1
        run: julia --startup-file=no --project=scripts/us scripts/us/accounting/run_inventory_transition_evidence_ledger.jl "${{ runner.temp }}/us-inventory-transition-evidence"
      - name: Census M3 inventory-stage fixture offline regeneration
        run: python3 scripts/us/accounting/census_m3_inventory_stage/test_generate_census_m3_inventory_stage_fixture.py
      - name: Census M3 inventory-stage evidence
        env:
