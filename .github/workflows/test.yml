      - name: Inventory-stock ledger contract
        run: julia --startup-file=no --project=scripts/us scripts/us/accounting/test_inventory_stock_ledger.jl
      - name: BEA T50805B current-vintage inventory-stock diagnostic
        run: julia --startup-file=no --project=scripts/us scripts/us/accounting/test_bea_inventory_stock_diagnostic.jl
      - name: Fail-closed inventory transition evidence ledger
