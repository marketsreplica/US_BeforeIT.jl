name: Run tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags: '*'
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}

      - uses: actions/cache@v5
        env:
          cache-name: cache-artifacts
        with:
          path: ~/.julia/artifacts
          key: ${{ runner.os }}-test-${{ env.cache-name }}-${{ hashFiles('**/Project.toml') }}
          restore-keys: |
            ${{ runner.os }}-test-${{ env.cache-name }}-
            ${{ runner.os }}-test-
            ${{ runner.os }}-
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: 2
          BEFOREIT_RUN_REMOTE_TESTS: 'false'

  us-science:
    name: U.S. scientific validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          # Pinned exactly: the ABM seed stream derives from Base.hash and is drawn
          # through the default global RNG, both of which are version-bound. A
          # different 1.10.x would produce different paths from the same seeds and
          # could not reproduce the committed ensemble caches.
          version: '1.10.3'
      - uses: actions/cache@v5
        env:
          cache-name: cache-us-offline
        with:
          path: ~/.julia
          key: ${{ runner.os }}-us-${{ env.cache-name }}-${{ hashFiles('scripts/us/Project.toml', 'scripts/us/Manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-us-${{ env.cache-name }}-
            ${{ runner.os }}-us-
      - name: Instantiate U.S. environment
        run: julia --project=scripts/us -e 'using Pkg; Pkg.instantiate()'
      - name: U.S. pipeline offline tests
        run: julia --startup-file=no --project=scripts/us scripts/us/test/runtests.jl
      - name: Source-aware supply, make, and symmetric-use diagnostics
        run: julia --startup-file=no --project=scripts/us scripts/us/accounting/test_supply_make.jl
      - name: BEA after-redefinitions 68-sector model-core aggregation
        env:
          JULIA_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: julia --startup-file=no --project=scripts/us scripts/us/accounting/test_after_redefinitions_model_core.jl
      - name: BEA after-redefinitions valuation envelope
        env:
          JULIA_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: julia --startup-file=no --project=scripts/us scripts/us/accounting/test_after_redefinitions_valuation_envelope.jl
      - name: BEA-anchored opening-accounting candidates
        env:
          JULIA_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: julia --startup-file=no --project=scripts/us scripts/us/accounting/test_opening_accounting_candidate.jl
      - name: Portable opening-accounting semantic construction and transitions
        env:
          JULIA_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: julia --startup-file=no --check-bounds=yes --project=scripts/us scripts/us/accounting/test_portable_accounting_semantics.jl
      - name: U.S. accounting-transition harness
        env:
          JULIA_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: julia --startup-file=no --project=scripts/us scripts/us/accounting/test_accounting_transition_harness.jl
      - name: Forecast protocol tests
        run: julia --startup-file=no --project=scripts/us scripts/us/forecasting/test_protocol.jl
      - name: Model-variant crosswalk tests
        run: julia --startup-file=no --project=. scripts/us/forecasting/variants/test_variants.jl
      - name: Bitemporal leakage tests
        run: julia --startup-file=no --project=scripts/us scripts/us/validation/test_bitemporal.jl
      - name: Parameter registry contract tests
        run: julia --startup-file=no --project=scripts/us scripts/us/calibration/runtests.jl
      - name: Statistical benchmark contract tests
        run: julia --startup-file=no --project=scripts/us scripts/us/forecasting/benchmarks/test_benchmarks.jl
      - name: Frozen benchmark model-registry tests
        run: julia --startup-file=no --check-bounds=yes --project=scripts/us scripts/us/forecasting/benchmarks/test_benchmark_model_registry.jl
      - name: Stage-2b DSGE column tests (gensys oracle, SW07, estimation)
        run: julia --startup-file=no --check-bounds=yes --project=scripts/us scripts/us/forecasting/benchmarks/dsge_columns/test_dsge_columns.jl
      - name: Hermetic forecast-score kernel tests
        run: julia --startup-file=no --check-bounds=yes --project=scripts/us scripts/us/forecasting/scoring/test_forecast_scores.jl
      - name: Forecast-comparison inference kernel tests
        run: julia --startup-file=no --depwarn=error --check-bounds=yes --project=scripts/us scripts/us/forecasting/inference/test_forecast_inference.jl
      - name: Upstream regime-adjudication ledger tests
        run: julia --startup-file=no --depwarn=error --check-bounds=yes --project=scripts/us scripts/us/forecasting/inference/regime_adjudication/test_regime_adjudication_ledger.jl
      - name: Synthetic exact-design inference-calibration contract tests
        run: julia --startup-file=no --depwarn=error --check-bounds=yes --project=scripts/us scripts/us/forecasting/inference/calibration/test_forecast_inference_calibration.jl
      - name: Quarantined revised-data panel fixture tests
        run: python3 scripts/us/forecasting/diagnostics/revised_data/test_revised_panel.py
      - name: Quarantined revised-data benchmark diagnostic tests
        env:
          JULIA_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: julia --startup-file=no --project=scripts/us scripts/us/forecasting/diagnostics/test_revised_data_benchmark_diagnostic.jl
      - name: Quarantined revised-data semi-structural comparison tests
        env:
          JULIA_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: julia --startup-file=no --check-bounds=yes --project=scripts/us scripts/us/forecasting/diagnostics/test_revised_data_semi_structural_comparison.jl
      - name: ABM comparison runner regression tests
        env:
          JULIA_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: julia --startup-file=no --project=scripts/us scripts/us/forecasting/diagnostics/abm_revised_comparison/test_abm_comparison_runner.jl
      - name: Tier-1 target and truth coverage tests
        run: julia --startup-file=no --project=scripts/us scripts/us/forecasting/targets/test_target_coverage.jl
      - name: Synthetic ABM GDP operator-mechanics qualification
        run: julia --startup-file=no --depwarn=error --check-bounds=yes --project=scripts/us scripts/us/forecasting/targets/abm_gdp_operator/test_abm_gdp_operator_qualification.jl
