name: U.S. prospective capture deadline

on:
  workflow_dispatch:
  schedule:
    - cron: '35 12 * * 1-5'
    - cron: '5 14 * * 1-5'

permissions:
  contents: read

concurrency:
  group: us-prospective-capture-deadline
  cancel-in-progress: false

jobs:
  receipt-guard:
    name: Schedule snapshot and immutable receipt deadline guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - name: Validate hermetic BEA schedule parser
        run: julia --startup-file=no --project=scripts/us scripts/us/forecasting/vintages/bea_schedule/test_bea_schedule_monitor.jl
      - name: Create bounded schedule snapshot directory
        run: mkdir -p artifacts/bea-schedule
      - name: Revalidate and snapshot mutable BEA schedule
        id: bea_schedule_snapshot
        run: julia --startup-file=no --project=scripts/us scripts/us/forecasting/vintages/bea_schedule/live_snapshot.jl --live artifacts/bea-schedule
      - name: Upload mutable BEA schedule snapshot
        if: ${{ always() && steps.bea_schedule_snapshot.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: bea-schedule-revalidation-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/bea-schedule/
          if-no-files-found: error
          retention-days: 30
      - name: Run deterministic historical-backfill contract tests
        if: ${{ always() }}
        run: julia --startup-file=no --project=scripts/us scripts/us/forecasting/vintages/test_historical_backfill_plan.jl
      - name: Validate current prospective receipt deadline
        if: ${{ always() }}
        run: julia --startup-file=no --project=scripts/us scripts/us/forecasting/vintages/check_prospective_capture_deadline.jl
